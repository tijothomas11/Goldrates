<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kerala Gold Rate History</title>

  <meta name="color-scheme" content="light dark">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <style>
    :root {
      color-scheme: light dark;

      --gold: #d4a017;
      --border: #e5e5e5;
      --background: #f5f5f5;
      --text: #333;
      --card: #fff;
      --shadow: rgba(0, 0, 0, 0.07);
      --surface-hover: #fff9e7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;

        --gold: #bc8916;
        --border: rgba(255, 255, 255, 0.1);
        --background: #0d0d0d;
        --text: #ffffff;
        --card: #1a1a19;
        --shadow: rgba(0, 0, 0, 0.5);
        --surface-hover: rgba(212, 160, 23, 0.14);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .toolbar a {
      display: inline-flex;
      min-height: 36px;
      padding: 8px 14px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }

    .toolbar a:hover {
      border-color: var(--gold);
      background: var(--surface-hover);
    }

    .chart-card {
      /*
      * Always light: the embedded SVG has a white
      * background baked in, so this card frames it
      * like an image rather than following the page
      * theme.
      */
      padding: 16px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      box-shadow: 0 3px 18px rgba(0, 0, 0, 0.07);
    }

    .chart-scroll {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
    }

    .chart-card object {
      
      width: 900px;
      min-width: 900px;
      height: 500px;
      
    }

    @media (max-width: 720px) {
      body {
        padding: 12px;
      }

      .chart-card {
        padding: 6px;
      }

      .chart-card object {
        min-height: 420px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="toolbar">
      <a href="index.html">
        Back to interactive chart
      </a>

      <a href="gold_rates.svg" download>
        Download SVG
      </a>
    </div>

    <div class="chart-card">
      <div class="chart-scroll"> 
        <object
          data="gold_rates.svg?v=5"
          type="image/svg+xml"
          aria-label="Static Kerala gold-rate history chart"
        >
          gold_rates.svg
            Open the static SVG chart
          </a>
        </object>
      </div>
    </div>
  </main>
</body>
</html>
